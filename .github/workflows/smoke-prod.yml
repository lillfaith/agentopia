# TEMPORARY: build the production image like Railway does and health-check it. No secrets, no AI calls.
name: smoke-prod
on:
  push:
    branches: [claude/happy-fermi-ypjunl]
    paths: [.github/workflows/smoke-prod.yml]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git log --oneline -1
      - run: docker build -t agentopia-test .
      - run: |
          docker run -d --name app -p 8787:8787 -e RAILWAY_ENVIRONMENT=production -e RAILWAY_PROJECT_ID=x -e ANTHROPIC_API_KEY=sk-ant-fake agentopia-test
          for i in $(seq 1 60); do curl -fsS localhost:8787/api/ready && break; sleep 2; done; echo
          docker logs app 2>&1 | tail -30
          curl -fsS localhost:8787/api/ready
          curl -fsS localhost:8787/ | grep -o 'index-[A-Za-z0-9_-]*\.js'
