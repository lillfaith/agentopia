# TEMPORARY: free production smoke test. No secrets, no AI calls.
name: smoke-prod
on:
  push:
    branches: [claude/happy-fermi-ypjunl]
    paths: [.github/workflows/smoke-prod.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -u
          BASE=https://agentopia-production.up.railway.app
          JS=$(curl -fsS "$BASE/" | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          echo "bundle: $JS"
          curl -fsS "$BASE$JS" -o b.js
          for m in "Model choice|PR14" "Where the money went|PR13" "Make a free suggestion|PR12" "Choose a job|PR11" "Hire an employee|PR11"; do
            s=${m%|*}; p=${m#*|}; if grep -q "$s" b.js; then echo "present  $p: $s"; else echo "MISSING  $p: $s"; fi
          done
          echo "health: $(curl -sS $BASE/api/health)"
          echo "ready:  $(curl -sS $BASE/api/ready)"
          echo "home:   HTTP $(curl -s -o /dev/null -w '%{http_code}' $BASE/)"
          echo "snapshot without login: HTTP $(curl -s -o /dev/null -w '%{http_code}' $BASE/api/snapshot)"
          curl -sSI "$BASE/" | grep -i -E "^(date|last-modified|etag|x-railway)" || true
