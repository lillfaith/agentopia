# End-to-end SaaS vertical slice against the REAL Claude API (npm run e2e:live):
# sign up → project → task → background run → real output → persists across a restart.
# Uses claude-haiku-5-5 and a one-paragraph task: a few cents at most per run.
# Runs only when started by hand: paid test runs need the owner's go-ahead.
# Spend is operator-funded test spend, capped per run, and reported in the job summary; it never touches customer data.
name: e2e-live

# Manual only (Actions → e2e-live → Run workflow). Paid live tests never start on a push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: npm run e2e:live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI || secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_KEY || secrets.CLAUDE_API_KEY }}
          # Which key paid, for the spend report (never the value): a dedicated CI key keeps test spend apart from customers in the Anthropic Console.
          AGENTOPIA_CI_KEY_SOURCE: ${{ secrets.ANTHROPIC_API_KEY_CI != '' && 'dedicated CI key (ANTHROPIC_API_KEY_CI)' || 'shared key (set ANTHROPIC_API_KEY_CI to separate test spend)' }}
          NODE_NO_WARNINGS: "1"
          # Hard ceilings for this test town, so a bug can't run up a bill.
          AGENTOPIA_DAILY_BUDGET_USD: "0.50"
          AGENTOPIA_MAX_TASK_COST_USD: "0.05"
        run: npm run e2e:live
