# Typecheck, unit/integration tests and a production build on every push and pull request.
# Uses no secrets and makes no AI calls.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_NO_WARNINGS: "1"
      - run: npm run build
